# Runs the tests on every push and pull request. When a GitHub release is
# published, also builds RoNTAK-<tag>.zip and attaches it to the release.
name: Tests and release ZIP

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install lupa
          python -m unittest discover -s tests -v
      - name: Build ZIP
        if: github.event_name == 'release'
        run: python tools/package.py "${{ github.event.release.tag_name }}"
      - name: Attach ZIP to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
